<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sagoma</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        /* Sfondo solo su html: quello del body coprirebbe il canvas della vista 3D, che sta sotto l'app. */
        html { background: #F8F9FA; }
        body { background: transparent; }
        #caricamento { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            font-family: system-ui, sans-serif; color: #2F5D62; font-size: 18px; }
    </style>
    <script type="application/javascript" src="sagoma.js"></script>
</head>
<body>
<div id="caricamento">Caricamento di Sagoma…</div>
<script>
    // Stessa scelta della lingua dell'app (Come il sistema se non ancora scelta).
    (function () {
        var scelta = null;
        try { scelta = localStorage.getItem("sagoma/lingua"); } catch (e) {}
        var sistema = (navigator.language || "it").toLowerCase().substring(0, 2);
        var codici = { Italian: "it", English: "en", French: "fr", Spanish: "es" };
        var lingua = codici[scelta] || (["it", "en", "fr", "es"].indexOf(sistema) >= 0 ? sistema : "en");
        var testi = { en: "Loading Sagoma…", fr: "Chargement de Sagoma…", es: "Cargando Sagoma…" };
        if (lingua !== "it") {
            document.documentElement.lang = lingua;
            document.getElementById("caricamento").textContent = testi[lingua];
        }
    })();
</script>
</body>
</html>
