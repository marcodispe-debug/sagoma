    (function () {

        var sistema = (navigator.language || "it").toLowerCase().substring(0, 2);
        var codici = { Italian: "it", English: "en", French: "fr", Spanish: "es", German: "de" };
        var lingua = codici[scelta] || (["it", "en", "fr", "es", "de"].indexOf(sistema) >= 0 ? sistema : "en");
        var testi = { en: "Loading Sagoma…", fr: "Chargement de Sagoma…", es: "Cargando Sagoma…", de: "Sagoma wird geladen…" };
        if (lingua !== "it") {
            document.documentElement.lang = lingua;
            document.getElementById("caricamento-testo").textContent = testi[lingua];
        }
    })();
